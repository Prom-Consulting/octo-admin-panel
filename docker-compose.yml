version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin-database
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8080:8080"

  nats:
    image: nats:latest
    container_name: nats_server
    restart: always
    ports:
      - "5922:5922"  # Client connections
    command: "-js -m 8222"  # Enable JetStream and monitoring

volumes:
  pg_data:
